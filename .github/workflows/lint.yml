# SPDX-License-Identifier: MIT OR Apache-2.0
# The fast lint tier on every push: rustfmt, Mix syntax and data checks, and
# the repository's own gates (tools/lint.mix). It compiles no Rust and runs
# no tests; the full gate runs on the CBC build hosts for the weekly Friday
# candidate (docs/docs/decisions/2026-10-22-weekly-cbc-releases.md).
name: lint

# Every pushed branch is linted. Pull requests are linted only from forks:
# a branch in this repository already runs on push.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Install lint tools
        run: pacman -Syu --noconfirm --needed git github-cli coreutils rustup jq tar gzip grep gawk which diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain comes from rust-toolchain.toml; only rustfmt is needed.
      # cargo metadata (closure and layering gates) needs cargo itself.
      - name: Install Rust
        run: rustup toolchain install --profile minimal --component rustfmt

      # Workspace members only: vendor/ keeps its upstream formatting, which
      # is why this is not `cargo fmt --all` (that reaches path dependencies).
      - name: Format
        run: cargo fmt --check

      # Mix runs every other check. It is not on the runner, so take the
      # binary from the latest published release and check the archive
      # against its own line in that release's SHA256SUMS.txt before use: a
      # missing line fails. Arch follows the gold host's glibc; no floor or
      # cross-build is imposed. This is the last released Mix.
      - name: Fetch released mix
        id: fetch-mix
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stop at the first newest-first page with a matching line. Within
          # that page, semantic version and tag date beat publication time.
          find_tag() {
            local pattern="$1" page=1 rows found
            while :; do
              rows=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page") || return 1
              found=$(printf '%s' "$rows" | jq -r --arg pattern "$pattern" '
                [.[] | select(.draft == false and .prerelease == false)
                  | . as $r | (.tag_name | capture($pattern)) as $v
                  | {tag: $r.tag_name, key: [($v.major|tonumber), ($v.minor|tonumber), ($v.patch|tonumber), (($v.date // "0")|tonumber), $r.published_at]}]
                | sort_by(.key) | last | .tag // empty') || return 1
              if [ -n "$found" ]; then printf '%s\n' "$found"; return; fi
              [ "$(printf '%s' "$rows" | jq length)" -eq 100 ] || return 0
              page=$((page + 1))
            done
          }
          tag=$(find_tag '^mix-v(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)-(?<date>[0-9]{8})$')
          dir="$RUNNER_TEMP/mixos-release"
          if [ -n "$tag" ]; then
            version=${tag#mix-v}
            version=${version%-????????}
            asset="mix-${version}-linux-x86_64"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern "$asset" --pattern SHA256SUMS.txt
            line=$(awk -v asset="$asset" '$2 == asset && length($1) == 64 {print}' "$dir/SHA256SUMS.txt")
            [ -n "$line" ] && [ "$(printf '%s\n' "$line" | wc -l)" = 1 ]
            (cd "$dir" && printf '%s\n' "$line" | sha256sum --check --strict -)
            install -D -m 0755 "$dir/$asset" "$RUNNER_TEMP/mixos/bin/mix"
          else
          tag=$(find_tag '^(v|mixos-server-v)(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)(-(?<date>[0-9]{8}))?$')
          [ -n "$tag" ] || { echo "::error::no published MixOS release to take mix from"; exit 1; }
          case "$tag" in
            mixos-server-v*) version=${tag#mixos-server-v}; version=${version%-????????} ;;
            v*) version=${tag#v} ;;
          esac
          archive="mixos-server-${version}-linux-x86_64.tar.gz"
          dir="$RUNNER_TEMP/mixos-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern "$archive" --pattern SHA256SUMS.txt
          line=$(grep -E "^[0-9a-f]{64}  ${archive//./\\.}\$" "$dir/SHA256SUMS.txt") ||
            { echo "::error::SHA256SUMS.txt has no line for $archive"; exit 1; }
          [ "$(printf '%s\n' "$line" | wc -l)" = 1 ]
          (cd "$dir" && printf '%s\n' "$line" | sha256sum --check --strict -)
          member="${archive%.tar.gz}/bin/mix"
          tar -xzf "$dir/$archive" -C "$dir" "$member"
          [ -f "$dir/$member" ] && [ ! -L "$dir/$member" ]
          install -D -m 0755 "$dir/$member" "$RUNNER_TEMP/mixos/bin/mix"
          fi
          echo "$RUNNER_TEMP/mixos/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mixos/bin/mix" --version

      - name: Lint
        if: ${{ !cancelled() && steps.fetch-mix.outcome == 'success' }}
        run: mix tools/lint.mix
