# SPDX-License-Identifier: MIT OR Apache-2.0
# Release: push main to the `release` branch
# (git push origin main:release); this builds MixOS for
# Linux x86_64 and aarch64 against Ubuntu 24.04's glibc (2.39), packs the
# prefix tarballs with tools/package.mix, and drafts GitHub release v<version>
# with a SHA256SUMS.txt. Publishing the draft is the human step; once it is
# published, releasesd (Prefs ▸ Apps) offers it to every MixOS install.
#
# The version is [workspace.package] version in Cargo.toml, the MixOS
# release version (AGENTS.md §5). A version that is already published is
# refused: bump it first.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Resolve version
        run: |
          v=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Cargo.toml [workspace.package] version '$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "prerelease=$pre" >>"$GITHUB_OUTPUT"
          echo "### MixOS v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, jobs: 4 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, jobs: 2 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libegl-dev libgles-dev libgbm-dev libdrm-dev libinput-dev libudev-dev \
            libseat-dev libpixman-1-dev libpulse-dev

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}

      # Fat LTO with one codegen unit is memory-hungry: the arm runner's build
      # was killed (exit 143) part-way through twice at four parallel jobs.
      # Swap there plus a per-arch job cap keeps it alive; free -m every minute
      # shows the pressure if it still dies.
      - name: Swap
        if: matrix.arch == 'aarch64'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/build.swap || sudo fallocate -l 8G /build.swap
          f=$(ls /mnt/build.swap /build.swap 2>/dev/null | head -1)
          sudo chmod 600 "$f" && sudo mkswap "$f" && sudo swapon "$f"
          free -m

      - name: Build
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: |
          ( while sleep 60; do free -m | sed -n 2,3p; done ) &
          cargo build --release --locked \
            -p system -p mixos-mcp -p noded -p editd -p settingsd -p portald \
            -p compd -p ced -p dopus -p prefs -p busviewer -p screenshot -p indexd

      - name: Package
        run: target/release/mix tools/package.mix --release "$VERSION" --arch ${{ matrix.arch }}

      # Every binary runs on this runner's glibc, and each tarball is a
      # prefix releasesd accepts (one top directory holding bin/).
      - name: Check the packages
        run: |
          target/release/mix -c 'print(platform().arch)'
          for t in dist/release/*.tar.gz; do
            tar -tzf "$t" | grep -E '^[^/]+/bin/[^/]+$'
          done
          objdump -T target/release/mix target/release/compd | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [version, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      # releasesd verifies every download against this file and GitHub's own
      # digest; a release without either is refused.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt

      - name: Create or update the draft
        working-directory: artifacts
        run: |
          tag="v$VERSION"
          title="MixOS v$VERSION"
          pre=()
          if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump [workspace.package] version before pushing to release."
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creating draft $tag"
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
