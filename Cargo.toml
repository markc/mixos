# MixOS workspace. Every package is a component or a component's private
# crate (AGENTS.md §1–§2); vendor/ holds patched upstreams, several with their
# own [workspace].

[workspace]
resolver = "3"
# libs/* includes maildoc and every other shared library component.
members = ["libs/*", "services/blobd", "services/noded","services/noded/crates/*", "cli/mix-shell", "cli/system", "cli/mixos-mcp", "cli/mesh-sign", "services/editd", "services/settingsd", "services/portald", "services/clipd", "services/hostd", "services/inputd", "services/inputd/crates/*", "services/maild", "services/webd", "services/dnsd", "services/dnsd/crates/*", "services/maild/crates/*", "services/monitord", "services/mixtrayd", "services/indexd", "apps/workshop", "apps/workshop/crates/*", "apps/monitor", "apps/monitor/crates/*", "apps/prefs", "apps/prefs/crates/*", "apps/ced", "apps/ced/crates/*", "apps/dopus", "apps/dopus/crates/*", "apps/screenshot", "apps/screenshot/crates/*", "apps/backdrop", "apps/backdrop/crates/*", "apps/email", "apps/email/crates/*", "apps/term", "apps/term/crates/*","services/compd","services/compd/crates/*"]
exclude = ["vendor", "vendor/teletypewriter", "vendor/msedit/lsh", "vendor/msedit/stdext"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markc/mixos"

# The engine crates still carry warnings; a clippy-clean pass is its own change.
[workspace.lints.rust]
warnings = "allow"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
bcrypt = "0.16"
directories = "6"
glob = "0.3"
hickory-resolver = { version = "0.25", features = ["tokio", "system-config"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
linkify = "0.10"
mail-auth = { version = "0.7", default-features = false, features = ["ring", "generate"] }
mail-builder = "0.4"
mail-parser = "=0.11.5"
mail-send = "0.5"
quick-xml = "0.37"
regex = "1"
rpassword = "7"
rustls-native-certs = "0.8"
rustls-pki-types = "1.13"
smtp-proto = "0.2"
spamlite = { git = "https://github.com/markc/spamlite", rev = "98f91a9d8142f92ae89ba4f070a165ce86fa5e8d", default-features = false }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
unicode-normalization = "0.1"
webpki-roots = "0.26"
x509-parser = "0.18"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
arc-swap = "1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
# hostd: WireGuard public keys (X25519); already in the lock through ed25519-dalek.
curve25519-dalek = "4.1"
futures-util = "=0.3.34"
hex = "0.4"
hmac = "0.12"
libc = { version = "=0.2.189" }
mimalloc = { version = "0.1", default-features = false }
metrics = "0.24"
metrics-util = "0.18"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
# email's JMAP transport: rustls only (no native-tls); the account's own CA
# is added per client, never a global invalid-certificate acceptance.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustc-hash = "2"
# indexd's embedding stack (_plan/2026-10-20-indexd-port.md D3–D5): crates.io
# candle, not git. 0.10.2's nomic_bert.rs is byte-identical to the predecessor's pin
# 09b9145. candle-core itself requires tokenizers 0.22 with `onig` on every
# non-wasm target, so indexd matches it exactly, giving ONE tokenizers. onig (C)
# stays because candle needs it. Without `esaxx_fast`, esaxx-rs builds without C++.
candle-core = { version = "=0.10.2" }
candle-nn = { version = "=0.10.2" }
candle-transformers = { version = "=0.10.2" }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
sqlite-vec = { version = "=0.1.9" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
# serde_json must never gain `preserve_order` (indexmap): frozen wire formats
# rely on BTreeMap key order.
serde_json = { version = "=1.0.151" }
schemars = { version = "=1.2.3" }
sha2 = { version = "=0.10.9" }
tempfile = "=3.27.0"
thiserror = { version = "=2.0.20" }
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "=0.26.2"
tracing = { version = "=0.1.44" }
tracing-appender = "0.2"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.24.1", features = ["fast-rng", "serde", "v7"] }
# D-Bus for the session portal (services/portald). Pinned to the version the
# lock already resolves; the tokio backend only, no async-io or blocking API.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

# GUI (AGENTS.md §4.1): egui on wgpu from crates.io, one version of each.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wayland", "wgpu"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
egui_plot = { version = "=0.38.0", default-features = false }
egui_kittest = { version = "=0.37.0", features = ["snapshot", "wgpu"] }
fluent-bundle = "=0.15.3"
futures = "=0.3.34"
# Window captures over the Bus (toolkit::drive); the version image already uses.
png = "=0.18.1"
# toolkit::markdown: the parser only (no `html` feature), the version Mix's
# markdown feature already locks.
pulldown-cmark = { version = "=0.12.2", default-features = false }

# Shared libraries (libs/).
assets = { path = "libs/assets" }
buildinfo = { path = "libs/buildinfo" }
davproto = { path = "libs/davproto" }
bus = { path = "libs/bus", default-features = false }
config = { path = "libs/config" }
action = { path = "libs/action" }
daemon = { path = "libs/daemon" }
files = { path = "libs/files" }
design = { path = "libs/design" }
icons = { path = "libs/icons" }
edit = { path = "libs/edit" }
editor = { path = "libs/editor" }
# The Mix lexer is opt-in (ced enables it); a plain-text editor does not need Mix.
editor-model = { path = "libs/editor-model", default-features = false }
expr = { path = "libs/expr" }
logging = { path = "libs/logging" }
macros = { path = "libs/macros" }
maildoc = { path = "libs/maildoc" }
mix = { path = "libs/mix" }
syntax = { path = "libs/syntax" }
props = { path = "libs/props" }
scene = { path = "libs/scene" }
settings = { path = "libs/settings" }
strict = { path = "libs/strict" }
mimedb = { path = "libs/mimedb" }
thumbs = { path = "libs/thumbs" }
toolkit = { path = "libs/toolkit" }
citizen = { path = "libs/citizen" }

# The compositor (services/compd): smithay with compd's hooks and patches
# (vendor/smithay/PATCHES.md), and wgpu on the GL backend only, sharing
# smithay's EGL context.
smithay = { path = "vendor/smithay", version = "0.7.0", default-features = false, features = ["backend_drm", "backend_egl", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "drm", "gbm", "renderer_gl", "renderer_multi", "renderer_pixman", "use_system_lib", "wayland-egl", "wayland_frontend", "xwayland"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["gles", "parking_lot", "std", "wgsl"] }
egui-wgpu = { version = "=0.37.0", default-features = false }
bindgen = "=0.71.1"
bitflags = "=2.13.1"
cc = "=1.4.3"
crossbeam-channel = "=0.5.16"
drm-ffi = "=0.9.1"
gbm = "=0.18.0"
glow = "=0.17.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pkg-config = "=0.3.34"
pollster = "=1.0.1"
xcursor = "=0.3.11"
# Flexbox layout of Mix Scenes in scene-host.
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
# Scene icons: SVG rasterised at draw size (the version egui_extras already uses).
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images"] }
# Window-title shaping in decor (embedded faces only, so no fontconfig).
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
libpulse-binding = "=2.30.1"
mpris = "=2.1.0"
wayland-backend = "=0.3.17"
wayland-scanner = "=0.31.11"

# compd private crates (services/compd/crates/).
comp-model = { path = "services/compd/crates/comp-model" }
comp-service = { path = "services/compd/crates/comp-service" }
decor = { path = "services/compd/crates/decor" }
dispatcher = { path = "services/compd/crates/dispatcher" }
drivers = { path = "services/compd/crates/drivers" }
effects = { path = "services/compd/crates/effects" }
protocols = { path = "services/compd/crates/protocols" }
screencopy = { path = "services/compd/crates/screencopy" }
x11-wm = { path = "services/compd/crates/x11-wm" }
edges = { path = "services/compd/crates/edges" }
frames = { path = "services/compd/crates/frames" }
native = { path = "services/compd/crates/native" }
nested = { path = "services/compd/crates/nested" }
headless = { path = "services/compd/crates/headless" }
outputs = { path = "services/compd/crates/outputs" }
policy-host = { path = "services/compd/crates/policy-host" }
recorder = { path = "services/compd/crates/recorder" }
scenegraph = { path = "services/compd/crates/scenegraph" }
scene-host = { path = "services/compd/crates/scene-host" }
seat = { path = "services/compd/crates/seat" }
testkit = { path = "services/compd/crates/testkit" }
graphics = { path = "services/compd/crates/graphics" }
kms = { path = "services/compd/crates/kms" }
ledger = { path = "services/compd/crates/ledger" }
model = { path = "services/compd/crates/model" }
motion = { path = "services/compd/crates/motion" }
policy = { path = "services/compd/crates/policy" }
render-gles = { path = "services/compd/crates/render-gles" }
slots = { path = "services/compd/crates/slots" }
surfaces = { path = "services/compd/crates/surfaces" }
ui = { path = "services/compd/crates/ui" }
world = { path = "services/compd/crates/world" }

# inputd's pure crates (services/inputd/crates/): compd's user-key layer
# reuses the classifier and the latch.
inputd-core = { path = "services/inputd/crates/inputd-core" }

# noded private crates (services/noded/crates/).
mesh = { path = "services/noded/crates/mesh" }
mesh-trust = { path = "services/noded/crates/mesh-trust" }

[patch.crates-io]
# Hidden-window paint requests bypass compositor frame callbacks and surface acquisition.
# See the upstream bases and guards in vendor/{eframe,egui-wgpu}/PATCHES.md.
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }
# maild's parser nesting safeguard; see vendor/mail-parser/PATCHES.md.
mail-parser = { path = "vendor/mail-parser" }
# dirs-sys without option-ext; calloop with composed-channel idle wakeups;
# input-rs with the tablet-pad DIAL event. See vendor/README.md.
dirs-sys = { path = "vendor/dirs-sys" }
calloop = { path = "vendor/calloop" }
input = { path = "vendor/input" }
# pipewire with Buffer::find_meta_mut, so portald can stamp each frame's PTS. See vendor/pipewire/PATCHES.md.
pipewire = { path = "vendor/pipewire" }

# Term's PTY with the child-only session-descriptor handoff
# (vendor/teletypewriter/PATCHES.md).
[patch."https://github.com/raphamorim/rio"]
teletypewriter = { path = "vendor/teletypewriter" }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
split-debuginfo = "packed"
strip = "symbols"

[profile.release-fast]
codegen-units = 16
inherits = "release"
lto = false
