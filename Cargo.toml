# MixOS workspace. Every package is a component or a component's private
# crate (AGENTS.md §1–§2); vendor/ holds patched upstreams, several with their
# own [workspace].

[workspace]
resolver = "3"
members = ["libs/*", "services/noded", "services/noded/crates/*", "cli/mix-shell", "services/editd", "services/settingsd", "services/portald", "apps/busviewer", "apps/busviewer/crates/*", "apps/prefs", "apps/prefs/crates/*"]
exclude = ["vendor", "vendor/msedit/lsh", "vendor/msedit/stdext"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/markc/mixos"

# The engine crates still carry warnings; a clippy-clean pass is its own change.
[workspace.lints.rust]
warnings = "allow"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
arc-swap = "1"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
futures-util = "=0.3.34"
hex = "0.4"
libc = { version = "=0.2.189" }
mimalloc = { version = "0.1", default-features = false }
metrics = "0.24"
metrics-util = "0.18"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
rand = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
# serde_json must never gain `preserve_order` (indexmap): frozen wire formats
# rely on BTreeMap key order.
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.10.9" }
tempfile = "=3.27.0"
thiserror = { version = "=2.0.20" }
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "=0.26.2"
tracing = { version = "=0.1.44" }
tracing-appender = "0.2"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.24.1", features = ["fast-rng", "serde", "v7"] }
# D-Bus for the session portal (services/portald). Pinned to the version the
# lock already resolves; the tokio backend only, no async-io or blocking API.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

# GUI (AGENTS.md §4.1): egui on wgpu from crates.io, one version of each.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu"] }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
egui_kittest = { version = "=0.36.2", features = ["snapshot", "wgpu"] }
fluent-bundle = "=0.15.3"
futures = "=0.3.34"
# Window captures over the Bus (toolkit::drive); the version image already uses.
png = "=0.18.1"

# Shared libraries (libs/).
assets = { path = "libs/assets" }
buildinfo = { path = "libs/buildinfo" }
bus = { path = "libs/bus", default-features = false }
config = { path = "libs/config" }
design = { path = "libs/design" }
edit = { path = "libs/edit" }
editor-model = { path = "libs/editor-model" }
expr = { path = "libs/expr" }
logging = { path = "libs/logging" }
mix = { path = "libs/mix" }
syntax = { path = "libs/syntax" }
props = { path = "libs/props" }
settings = { path = "libs/settings" }
strict = { path = "libs/strict" }
toolkit = { path = "libs/toolkit" }
citizen = { path = "libs/citizen" }

# noded private crates (services/noded/crates/).
mesh = { path = "services/noded/crates/mesh" }
mesh-trust = { path = "services/noded/crates/mesh-trust" }

[patch.crates-io]
# dirs-sys without option-ext; see vendor/README.md.
dirs-sys = { path = "vendor/dirs-sys" }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
split-debuginfo = "packed"
strip = "symbols"

[profile.release-fast]
codegen-units = 16
inherits = "release"
lto = false
