# REUSE-format licence annotations (https://reuse.software/spec/), so every
# file is covered without a per-file header. A file that carries its own SPDX
# header keeps it ("closest" precedence). Checked by a Mix gate (AGENTS.md §4).
version = 1

[[annotations]]
path = "vendor/mail-parser/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 Stalwart Labs Ltd."
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = "vendor/msedit/**"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/smithay/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 Victor Berger and Victoria Brekenfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/calloop/**"
precedence = "override"
SPDX-FileCopyrightText = "2018 Victor Berger"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/input/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 Victor Brekenfeld"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mark Constable <mc@mixos.dev>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "services/compd/**"
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Mark Constable <mc@mixos.dev>", "2026 Yarden Apelker"]
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Web fonts: subsets gen-site.mix cuts from the pinned asset set
# (docs/_build/site.conf.mix fonts.faces); the role names are its.
[[annotations]]
path = ["docs/_web/fonts/sans.woff2", "docs/_web/fonts/LICENSE-Inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/_web/fonts/mono.woff2", "docs/_web/fonts/mono-italic.woff2", "docs/_web/fonts/LICENSE-JetBrainsMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/_web/fonts/display.woff2", "docs/_web/fonts/LICENSE-Quicksand.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2011 The Quicksand Project Authors (https://github.com/andrew-paglinawan/QuicksandFamily), with Reserved Font Name Quicksand"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/_web/fonts/emoji.woff2", "docs/_web/fonts/LICENSE-NotoColorEmoji.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Google LLC (Noto Color Emoji, COLRv1 build)"
SPDX-License-Identifier = "OFL-1.1"

# The MixOS Desktop mascot (it also carries its own SPDX header).
[[annotations]]
path = "share/brand/logos/alien-cyclops.svg"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mark Constable <mc@mixos.dev>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Toolkit assets: unmodified upstream fonts and icons (NOTICE).
[[annotations]]
path = ["libs/toolkit/assets/fonts/Inter-*.ttf", "libs/toolkit/assets/fonts/OFL-Inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["libs/toolkit/assets/fonts/JetBrainsMono-Light.ttf", "libs/toolkit/assets/fonts/JetBrainsMono-Regular.ttf", "libs/toolkit/assets/fonts/JetBrainsMono-Medium.ttf", "libs/toolkit/assets/fonts/OFL-JetBrainsMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["libs/toolkit/assets/icons/*.svg", "libs/toolkit/assets/icons/LICENSE-lucide.txt", "apps/screenshot/assets/dev.mixos.screenshot-symbolic.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors; Cole Bemis (Feather-derived icons)"
SPDX-License-Identifier = "ISC AND MIT"

# Icon bundle: unmodified upstream Lucide SVGs and their licence (share/icons).
[[annotations]]
path = ["share/icons/lucide/*.svg", "share/icons/LICENSE-lucide.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors; Cole Bemis (Feather-derived icons)"
SPDX-License-Identifier = "ISC AND MIT"

# Provenance not yet recorded; clear it (or replace it) before a release.
[[annotations]]
path = "docs/_web/Server_Room_Dark.webp"
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "NOASSERTION"

# egui's unmodified fallback font notices; font bytes remain in the dependency.
[[annotations]]
path = "libs/toolkit/assets/fonts/fallbacks/LICENSE-Hack.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2018 Source Foundry Authors", "2003 Bitstream Inc."]
SPDX-License-Identifier = "MIT AND Bitstream-Vera"

[[annotations]]
path = "libs/toolkit/assets/fonts/fallbacks/LICENSE-NotoEmoji.txt"
precedence = "override"
SPDX-FileCopyrightText = "2013 Google Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "libs/toolkit/assets/fonts/fallbacks/LICENSE-Ubuntu.txt"
precedence = "override"
SPDX-FileCopyrightText = "2011 Canonical Ltd."
SPDX-License-Identifier = "Ubuntu-font-1.0"

[[annotations]]
path = "libs/toolkit/assets/fonts/fallbacks/LICENSE-EmojiIcon.txt"
precedence = "override"
SPDX-FileCopyrightText = "2014 John Slegers"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["docs/_web/icons/*.svg", "docs/_web/icons/LICENSE-Lucide.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors; Cole Bemis (Feather-derived icons)"
SPDX-License-Identifier = "ISC AND MIT"
