# backdrop: the MixOS desktop background — colour, image, slideshow and a
# live folder view — drawn with egui on compd's Background layer.
[package]
name = "backdrop"
description = "The MixOS desktop background: wallpapers, slideshows and a live folder view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "backdrop"
kind = "app"
layer = "desktop"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
toolkit.workspace = true
# The layer shell, outputs and seat (the version eframe's winit already uses).
smithay-client-toolkit = { version = "=0.19.2", default-features = false }
# The libwayland display pointer wgpu's GL backend needs.
wayland-backend = { workspace = true, features = ["client_system"] }
raw-window-handle = "0.6"
# wgpu's adapter and device requests are futures.
futures.workspace = true
serde_json.workspace = true
