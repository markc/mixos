# wallpaper: backdrop's wallpaper engine — the strict document, colour and
# fit rules, image limits and the revision bookkeeping. Pure data: no Bus,
# no window, no toolkit (AGENTS.md §4.1, engine first).
[package]
name = "wallpaper"
description = "Backdrop's wallpaper engine: configuration, validation, image limits and revisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "backdrop"
kind = "app"
layer = "core"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
# The strict-data reader and writer for the document (`backdrop.mx`).
config.workspace = true
# The `wallpaper.*` view, backdrop's authority once settingsd serves it
# (profile.rs).
settings.workspace = true
serde.workspace = true
serde_json.workspace = true
# O_NONBLOCK on the decoder's one open, so a FIFO cannot block the worker.
libc.workspace = true
# PNG (workspace) and JPEG (this crate's feature) only.
image = { workspace = true, features = ["jpeg"] }

[dev-dependencies]
tempfile.workspace = true
