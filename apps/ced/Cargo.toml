# ced: the MixOS Editor — the egui shell around the `documents` engine and
# the shared `editor` text view (AGENTS.md §4.1).
[package]
name = "ced"
description = "The MixOS Editor: a desktop editor over the edit Bus service, shared with people and agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "ced"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
bus = { workspace = true, features = ["native"] }
buildinfo.workspace = true
documents = { path = "crates/documents" }
edit.workspace = true
editor.workspace = true
editor-model = { workspace = true, features = ["mix"] }
eframe.workspace = true
egui.workspace = true
futures.workspace = true
mix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
toolkit.workspace = true
tracing.workspace = true

[dev-dependencies]
design.workspace = true
editor-model = { workspace = true, features = ["mix", "fake"] }
egui_kittest.workspace = true

[build-dependencies]
buildinfo.workspace = true
