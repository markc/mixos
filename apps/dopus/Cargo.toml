# dopus: the MixOS twin-pane file manager — the egui shell around the
# `dopus-core` engine (AGENTS.md §4.1).
[package]
name = "dopus"
description = "The MixOS twin-pane file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "dopus"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
bus = { workspace = true, features = ["native"] }
buildinfo.workspace = true
# The outbox and publisher for dopus.action.executed.
citizen.workspace = true
config.workspace = true
design.workspace = true
dopus-core = { path = "crates/dopus-core" }
eframe.workspace = true
egui.workspace = true
futures.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
toolkit.workspace = true
tracing.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
citizen = { workspace = true, features = ["testing"] }
egui_kittest.workspace = true
tempfile.workspace = true
# The chooser's deadline tests run on tokio's paused clock.
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[build-dependencies]
buildinfo.workspace = true
