[package]
name = "dopus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "DOpus renderer-free navigation, listings, file operations and persistence"

[package.metadata.mixos]
component = "dopus"
kind = "app"
layer = "core"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
mimedb.workspace = true
config.workspace = true
files.workspace = true
glob.workspace = true
thumbs.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }

[dev-dependencies]
tempfile.workspace = true
