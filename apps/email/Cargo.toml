# email: the reserved mail/calendar/contacts client — a pure JMAP client
# over HTTPS (AGENTS.md §4.1). The `jmap` engine crate holds the protocol;
# this crate is the egui shell.
[package]
name = "email"
description = "Pure JMAP mail, calendar and contacts reader and composer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "email"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
jmap = { path = "crates/jmap" }
maildoc = { path = "../../libs/maildoc" }
buildinfo.workspace = true
# The Bus connection: theme-follow topics and single-instance activation.
bus.workspace = true
citizen.workspace = true
chrono = { workspace = true, features = ["clock"] }
config.workspace = true
design.workspace = true
eframe.workspace = true
egui.workspace = true
editor.workspace = true
editor-model.workspace = true
futures.workspace = true
image.workspace = true
# O_NONBLOCK, so a CA path naming a FIFO never blocks its open.
libc.workspace = true
logging.workspace = true
# The print page: Markdown to HTML (raw HTML in the source made text).
pulldown-cmark = { workspace = true, features = ["html"] }
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
toolkit.workspace = true

[dev-dependencies]
citizen = { workspace = true, features = ["testing"] }
test-broker = { path = "../../libs/test-broker" }
egui_kittest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
buildinfo.workspace = true
