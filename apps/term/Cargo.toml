# term: Terminal, the egui shell around the term-core engine, its grid
# drawn on the GPU by term-render (AGENTS.md §4.1).
[package]
name = "term"
# Its own version: the term.* verbs are a public contract (CHANGELOG.md).
description = "Terminal: tabs and split panes over the term-core engine, the grid drawn on the GPU, every action a Bus-reachable command"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "term"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
bus = { workspace = true, features = ["native"] }
buildinfo.workspace = true
# The outbox for term.command.executed.
citizen.workspace = true
config.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
settings.workspace = true
# The Wayland clipboard and primary selection (egui has no primary).
smithay-clipboard = "=0.7.3"
term-core = { path = "crates/term-core" }
term-render = { path = "crates/term-render" }
tokio = { workspace = true, features = ["sync"] }
toolkit.workspace = true
# The display handle for the clipboard (raw-window-handle, as wgpu has it).
wgpu.workspace = true

[dev-dependencies]
design.workspace = true
egui-wgpu.workspace = true
egui_kittest.workspace = true
term-core = { path = "crates/term-core", features = ["test-support"] }

[build-dependencies]
buildinfo.workspace = true
