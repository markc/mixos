[package]
name = "tray"
version.workspace = true
rust-version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MixOS tray: a StatusNotifierItem that shows MixOS unit state on the Plasma tray"

[package.metadata.mixos]
component = "tray"
kind = "app"
layer = "desktop"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[[bin]]
name = "tray"
path = "src/main.rs"

[dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
zbus = { workspace = true, features = ["blocking-api"] }
