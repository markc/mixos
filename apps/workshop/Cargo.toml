# workshop: the egui shell around the inspector engine — browse ABP
# services and commands, call one with a JSON body (AGENTS.md §4.1).
[package]
name = "workshop"
description = "Native ABP service browser and command caller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "workshop"
kind = "app"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
bus = { workspace = true, features = ["native"] }
buildinfo.workspace = true
design.workspace = true
config.workspace = true
eframe.workspace = true
egui.workspace = true
editor.workspace = true
macros.workspace = true
futures.workspace = true
inspector = { path = "crates/inspector" }
serde_json.workspace = true
serde.workspace = true
settings.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
toolkit.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
inspector = { path = "crates/inspector", features = ["testing"] }
tempfile.workspace = true
test-broker = { path = "../../libs/test-broker" }

[build-dependencies]
buildinfo.workspace = true
