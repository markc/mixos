[package]
name = "system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The system binary: the mix shell and the headless daemons, chosen by argv[0]"

# docs/docs/decisions/2026-10-12-one-system-binary.md. The one package allowed a
# non-dev dependency on a `kind = "cli"` package (AGENTS.md §6), and the one
# whose principal binary is not named after its directory (§2.3).
[package.metadata.mixos]
component = "system"
kind = "cli"
layer = "core"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[[bin]]
name = "mix"
path = "src/main.rs"

# One entry per personality. Each component's program is its own library's
# `main`; this package adds only the dispatcher and the global allocator.
[dependencies]
mix-shell = { path = "../mix-shell" }
noded = { path = "../../services/noded" }
monitord = { path = "../../services/monitord" }
mimalloc.workspace = true

# The shell's process-level tests (tests/), which run `mix` as built here.
# Versions match cli/mix-shell's, so the lock gains no second copy.
[dev-dependencies]
mix.workspace = true
bus = { workspace = true, features = ["native"] }
buildinfo.workspace = true
test-broker = { path = "../../libs/test-broker" }
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
proptest = "1"
tungstenite = "0.26"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["zeroize"] }
# tests/owned_editor_pty.rs compiles the shell's editor and session-state
# modules from source (#[path]), with their unit tests.
rustyline = "15"
signal-hook = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
