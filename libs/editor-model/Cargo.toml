[package]
name = "editor-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Headless text-editing model: commands and motions, highlighting, diagnostics, and the edit-service mirror"

[package.metadata.mixos]
component = "editor-model"
kind = "lib"
layer = "core"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[features]
default = ["mix"]
mix = ["dep:mix"]
fake = []

[dependencies]
edit.workspace = true
syntax.workspace = true
mix = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true

[dev-dependencies]
proptest = "1"
editor-model = { path = ".", features = ["fake"] }
