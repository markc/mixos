[package]
name = "mix-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Explicitly registered inbound Mix builtin family"

[package.metadata.mixos]
component = "mix-server"
kind = "lib"
layer = "mix"
contract = "none"

[features]
default = ["markdown"]
markdown = ["mix/markdown"]

[dependencies]
mix = { path = "../mix", features = ["net-client"] }
libc = "0.2"
socket2 = "0.6"
serde_json = "1"
indexmap = "2"
tokio = { version = "1", features = ["rt", "net", "time"] }

[lints.clippy]
mod_module_files = "deny"
