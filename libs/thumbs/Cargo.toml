[package]
name = "thumbs"
description = "File thumbnails through the freedesktop shared cache and the system's thumbnailers, made off the caller's thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "thumbs"
kind = "lib"
layer = "core"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
mimedb.workspace = true
md-5 = "0.10"
crc32fast = "1.5"
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "process", "fs", "dir"] }

[dev-dependencies]
tempfile.workspace = true
