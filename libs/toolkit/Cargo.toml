# toolkit: the shared shell for MixOS egui applications — theme, fonts,
# icons, the command registry and Fluent strings (AGENTS.md §4.1).
[package]
name = "toolkit"
description = "Shared egui application shell: design theme, fonts, Lucide icons, command registry, Fluent strings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "toolkit"
kind = "lib"
layer = "desktop"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
assets.workspace = true
config.workspace = true
design.workspace = true
macros.workspace = true
egui.workspace = true
egui_extras.workspace = true
command.workspace = true
# thumbnail: decodes the shared thumbnail cache's PNGs (never a user's file).
image.workspace = true
png.workspace = true
# markdown: CommonMark + GFM parsing into the toolkit's own document.
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
# The settings contract's data types only (no features: no Bus): session_look.
settings.workspace = true
# thumbnail: the cache's capped reads and its size limits.
thumbs.workspace = true
# layer: egui on wlr-layer-shell surfaces. smithay-client-toolkit 0.19.2, the
# one eframe's winit 0.30 already links (its calloop 0.13 for timers and
# wake-ups, xkbcommon for keys). The lock also holds 0.20 for vendored
# smithay's winit 0.31 dev chain: a known second line, retired when eframe
# moves to winit 0.31 and this follows it.
# wgpu's GL backend on the raw wl_surface, and libwayland's display pointer.
smithay-client-toolkit = { version = "=0.19.2", optional = true }
wayland-backend = { workspace = true, features = ["client_system"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# layer: per-key repeat from the compositor's keymap (the binding sctk links).
xkbcommon = { version = "0.7", default-features = false, optional = true }

[features]
layer = ["dep:smithay-client-toolkit", "dep:wayland-backend", "dep:raw-window-handle", "dep:wgpu", "dep:egui-wgpu", "dep:futures", "dep:xkbcommon"]

[dev-dependencies]
anyhow.workspace = true
libc.workspace = true
strict.workspace = true
uuid.workspace = true
egui_kittest.workspace = true
tempfile.workspace = true
