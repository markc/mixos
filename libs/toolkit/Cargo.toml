# toolkit: the shared shell for MixOS egui applications — theme, fonts,
# icons, the command registry and Fluent strings (AGENTS.md §4.1).
[package]
name = "toolkit"
description = "Shared egui application shell: design theme, fonts, Lucide icons, command registry, Fluent strings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "toolkit"
kind = "lib"
layer = "desktop"
contract = "none"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
config.workspace = true
design.workspace = true
egui.workspace = true
egui_extras.workspace = true
fluent-bundle.workspace = true
# thumbnail: decodes the shared thumbnail cache's PNGs (never a user's file).
image.workspace = true
png.workspace = true
serde.workspace = true
# executed: a run identity per process.
uuid.workspace = true
serde_json.workspace = true
# The settings contract's data types only (no features: no Bus): session_look.
settings.workspace = true
# thumbnail: the cache's capped reads and its size limits.
thumbs.workspace = true
# layer: egui on wlr-layer-shell surfaces. The smithay-client-toolkit eframe's
# winit already uses (its calloop for timers and wake-ups, xkbcommon for keys),
# wgpu's GL backend on the raw wl_surface, and libwayland's display pointer.
smithay-client-toolkit = { version = "=0.19.2", optional = true }
wayland-backend = { workspace = true, features = ["client_system"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
layer = ["dep:smithay-client-toolkit", "dep:wayland-backend", "dep:raw-window-handle", "dep:wgpu", "dep:egui-wgpu", "dep:futures"]

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
