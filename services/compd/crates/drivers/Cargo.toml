[package]
name = "drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.mixos]
component = "compd"
kind = "service"
layer = "desktop"
contract = "none"

[lints.rust]
warnings = "allow"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
model = { workspace = true }
slots = { workspace = true }
libpulse-binding = { workspace = true }
mpris = { workspace = true, optional = true }
smithay = { workspace = true }
zbus = { workspace = true, optional = true, features = ["blocking-api"] }

[features]
desktop-dbus = ["dep:mpris", "dep:zbus"]
