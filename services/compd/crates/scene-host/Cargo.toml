[package]
name = "scene-host"
description = "Mix Scenes host for compd: the shell.scene.* verbs, its own Bus registration, and the UI renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.mixos]
component = "compd"
kind = "service"
layer = "desktop"
contract = "none"

[lints.rust]
warnings = "allow"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
# The session look: the shared consumer on the host's own connection, with
# its offline cache, read through `crate::lane`.
settings = { workspace = true, features = ["native", "cache"] }
# conf.mix (strict data) and its path in the MixOS etc dir, as Quoin reads them.
config = { workspace = true }
# The chrome palette and server-side decoration themes.
decor = { workspace = true }
# The design library: typography roles, button cells, palettes.
design = { workspace = true }
# RedrawReason::Publish.
dispatcher = { workspace = true }
# The surfaces: compositor-owned UI instances in the world registry.
ui = { workspace = true }
world = { workspace = true }
# Scenes draw with egui on the MixOS look, laid out as flexbox by taffy.
egui = { workspace = true }
taffy = { workspace = true }
toolkit = { workspace = true }
# Scene icons: PNG decoded up front, SVG rasterised at draw size.
image = { workspace = true }
resvg = { workspace = true }
smithay = { workspace = true }
# The engine-neutral Mix Scenes core: parse, lint, resolve, diff, describe,
# bindings.
scene = { workspace = true }
# Quoin's panel model: one active page per edge, modes, motion.
edges = { workspace = true }
# The host's own Bus registration (`shell`), separate from the comp port.
bus = { workspace = true, features = ["client", "native"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The scene digest (`shell.scene.watch`), as Quoin computes it.
sha2 = { workspace = true }
# A current-thread runtime on the host's worker thread, as comp-service runs one.
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
egui_kittest.workspace = true
tempfile = "=3.27.0"

