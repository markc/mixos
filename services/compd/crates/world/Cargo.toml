[package]
name = "world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.mixos]
component = "compd"
kind = "service"
layer = "desktop"
contract = "none"

[lints.rust]
warnings = "allow"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
comp-model.workspace = true
serde_json.workspace = true
decor = { workspace = true }
dispatcher = { workspace = true }
drivers = { workspace = true }
graphics = { workspace = true }
ui = { workspace = true }
ledger = { workspace = true }
model = { workspace = true }
policy = { workspace = true }
surfaces = { workspace = true }
render-gles = { workspace = true }
slots = { workspace = true }
protocols = { workspace = true }
bitflags = { workspace = true }
# The user keymap's path (the MixOS etc dir) and its live reload.
config = { workspace = true }
notify = { workspace = true }
# The compositor's own UIs (capture overlays and dialogs, notifications,
# the frame-rate overlay) are egui programs on the MixOS look; strings come
# from services/compd/i18n.
egui = { workspace = true }
toolkit = { workspace = true }
smithay = { workspace = true }
uuid = { workspace = true }
xcursor = { workspace = true }

[features]
desktop-dbus = ["drivers/desktop-dbus", "graphics/desktop-dbus", "slots/desktop-dbus"]
