# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "hostd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Host information and privileged host actions through closed, typed commands"

[package.metadata.mixos]
component = "hostd"
kind = "service"
layer = "core"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[dependencies]
bus = { workspace = true, features = ["native"] }
zbus.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "net", "io-util"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
buildinfo.workspace = true
libc.workspace = true
chrono.workspace = true
strict.workspace = true
uuid.workspace = true
blake3.workspace = true
base64.workspace = true
curve25519-dalek.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
buildinfo.workspace = true
