[package]
name = "mixtrayd"
version.workspace = true
rust-version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MixOS tray daemon: answers the mixtray popup with COS, BUS, MIX and SSH state over the Bus"

[package.metadata.mixos]
component = "mixtrayd"
kind = "service"
layer = "desktop"
contract = "public"

[lints.clippy]
mod_module_files = "deny"

[[bin]]
name = "mixtrayd"
path = "src/main.rs"

[dependencies]
paths = { path = "../../libs/paths" }
anyhow.workspace = true
bus = { workspace = true, features = ["native"] }
futures.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
zbus = { workspace = true, features = ["blocking-api"] }
