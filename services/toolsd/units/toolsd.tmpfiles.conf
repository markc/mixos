# tmpfiles.d (install as /etc/tmpfiles.d/toolsd.conf) — runtime dir and pre-created lock
# file for the toolsd drain lock.
#
# NOT a systemd RuntimeDirectory= (that is ref-counted to the unit lifetime and would
# vanish between oneshot drains). tmpfiles creates these once at boot and leaves them.
#
# The DIRECTORY is root-owned 0755 so toolsd cannot unlink/recreate the lock inode out
# from under a holder. The lock FILE is pre-created and owned by toolsd so flock can open
# it; if it is ever absent, flock -n in the root-owned dir cannot create it and the drain
# fails CLOSED (it never runs unserialized).
d /run/toolsd 0755 root root -
f /run/toolsd/drain.lock 0644 toolsd toolsd -
