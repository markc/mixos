u webd 502 "MixOS web service" @{state}/webd /usr/sbin/nologin
# mixos-tls mediates read access to TLS keypairs shared by two or more daemons.
# Uid 502 and gid 510 keep the ids hosts already use, so a host renames its
# accounts in place and existing files keep their owners (D8).
g mixos-tls 510
m webd mixos-tls
